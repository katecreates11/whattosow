# Monthly dependency security check. Runs `npm audit` on the 1st of each month
# and fails (which emails the repo owner via GitHub) if a high/critical
# vulnerability appears, so security issues don't quietly pile up.
#
# Moderate/low findings won't fail the run (e.g. the known build-time postcss
# advisory inside Next's own deps). Run it any time from the Actions tab too.
name: Monthly npm audit

on:
  schedule:
    # 1st of every month at 08:07 UTC (off the :00 mark)
    - cron: "7 8 1 * *"
  workflow_dispatch: # manual "Run workflow" button

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Audit (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high
